name: BuildLoop CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: BuildLoop CI quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: buildloop_test
          POSTGRES_USER: buildloop
          POSTGRES_PASSWORD: buildloop_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buildloop -d buildloop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://buildloop:buildloop_test_only@localhost:5432/buildloop_test
      BUILDLOOP_ENVIRONMENT: test
      BETTER_AUTH_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      BETTER_AUTH_URL: http://localhost:3000
      PUBLIC_APP_URL: http://localhost:3000
      DATABASE_POOL_MAX: 3
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx drizzle-kit check
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm audit
      - name: Check PR and push diff whitespace
        run: git diff --check "${{ github.event.before || github.event.pull_request.base.sha }}...${{ github.sha }}"
